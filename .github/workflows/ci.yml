name: CI

# Not on every push: started by hand (Actions tab → CI → Run workflow) and when a release is published.
on:
  workflow_dispatch:
  release:
    types: [ published ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and unit tests
        run: ./gradlew assembleDebug testDebugUnitTest :core:model:test :core:common:test

      - name: Lint
        run: ./gradlew lintDebug

      # Without keystore.properties the release stays unsigned; what matters is that R8 gets through.
      # Its own Gradle run, so R8 doesn't share the daemon heap with the debug build and the tests.
      - name: Release build (R8)
        run: ./gradlew assembleRelease

      - name: Release APKs for the start test
        uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: |
            app/build/outputs/apk/release/*.apk
            wear/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Lint reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: '**/build/reports/lint-results-*.html'
          if-no-files-found: ignore

  # The release APKs on an emulator: a successful R8 build can still crash at run time (review2 Z21 B).
  start-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: phone
            apk: app/build/outputs/apk/release/app-release-unsigned.apk
            image: system-images;android-36;google_apis;x86_64
            device: pixel_6
          - name: watch
            apk: wear/build/outputs/apk/release/wear-release-unsigned.apk
            image: system-images;android-34;android-wear;x86_64
            device: wearos_large_round
    name: start-test (${{ matrix.name }})
    env:
      # avdmanager follows XDG_CONFIG_HOME (set on the runner), the emulator looks in ~/.android: one place for both.
      ANDROID_AVD_HOME: ${{ github.workspace }}/.avd
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: release-apks

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install emulator and system image
        env:
          IMAGE: ${{ matrix.image }}
          DEVICE: ${{ matrix.device }}
        run: |
          tools="$ANDROID_HOME/cmdline-tools/latest/bin"
          yes | "$tools/sdkmanager" --licenses > /dev/null || true
          "$tools/sdkmanager" --install emulator platform-tools "$IMAGE" | tail -3
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$tools/avdmanager" create avd -n start-test -k "$IMAGE" -d "$DEVICE"
          "$ANDROID_HOME/emulator/emulator" -list-avds
          ls -l /dev/kvm

      # Emulator and test in one step: the emulator runs exactly as long as the test, and its log is at hand when it fails.
      - name: Start test
        timeout-minutes: 20
        env:
          APK: ${{ matrix.apk }}
        run: |
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          "$ANDROID_HOME/emulator/emulator" -avd start-test -no-window -no-audio -no-boot-anim -no-snapshot \
            -gpu swiftshader_indirect -memory 3072 > emulator.log 2>&1 &
          sleep 10
          if ! kill -0 $! 2> /dev/null; then
            echo "The emulator ended right away:"
            cat emulator.log
            exit 1
          fi
          if ! tools/ci/smoke-start.sh "$APK"; then
            echo "--- emulator log"
            tail -150 emulator.log
            exit 1
          fi
